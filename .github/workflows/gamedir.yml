# 12.0: справочник моддируемых игр (1000+) — снимок desktop/ModLaunch/Assets/gamedir.config.json.
# Программа сама собирает его из открытых списков (игры Nexus, сообщества и схема Thunderstore):
# ModLaunch --gen-directory. Раз в неделю, вручную и при правке сборщика; коммит — только если файл изменился.
name: gamedir
on:
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * 1'
  push:
    branches: ['claude/**']
    paths: ['.github/workflows/gamedir.yml', 'desktop/ModLaunch/Games/GameDirectory.cs']
permissions:
  contents: write
env:
  DOTNET_NOLOGO: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
# Новый пуш в ту же ветку отменяет старый прогон — очередь не копится.
concurrency:
  group: gamedir-${{ github.ref }}
  cancel-in-progress: true
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('desktop/**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-
      - name: Build
        working-directory: desktop/ModLaunch
        run: dotnet build -c Release -r linux-x64 -nologo -v q
      # Меньше тысячи игр или сбой сети — код 1, файл не тронут: в ветку не попадёт обрезанный список.
      - name: Generate the game directory
        working-directory: desktop/ModLaunch
        env:
          MODLAUNCH_DATA: ${{ runner.temp }}/modlaunch-data
        run: ./bin/Release/net8.0/linux-x64/ModLaunch --gen-directory Assets/gamedir.config.json
      - name: Commit
        run: |
          git config user.name "$(git log -1 --format=%an)"
          git config user.email "$(git log -1 --format=%ae)"
          git add desktop/ModLaunch/Assets/gamedir.config.json
          git diff --cached --quiet && exit 0
          git commit -m "Game directory: refresh snapshot from Nexus and Thunderstore"
          # Пока шла сборка, в ветку могли запушить — догоняем и пушим ещё раз.
          git push || (git pull --rebase -q && git push)
