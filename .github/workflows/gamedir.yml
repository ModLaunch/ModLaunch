# 12.0: справочник моддируемых игр (1000+) — снимок desktop/ModLaunch/Assets/gamedir.config.json.
# Программа сама собирает его из открытых списков (игры Nexus, сообщества и схема Thunderstore):
# ModLaunch --gen-directory. Раз в неделю, вручную и при правке сборщика; коммит — только если файл изменился.
# 15.0: и все игры Steam (100 тыс.+) — Assets/steamgames.tsv.gz (ModLaunch --gen-steam).
name: gamedir
on:
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * 1'
  push:
    branches: ['claude/**']
    paths: ['.github/workflows/gamedir.yml', 'desktop/ModLaunch/Games/GameDirectory*.cs']
permissions:
  contents: write
env:
  DOTNET_NOLOGO: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
# Новый пуш в ту же ветку отменяет старый прогон — очередь не копится.
concurrency:
  group: gamedir-${{ github.ref }}
  cancel-in-progress: true
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('desktop/**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-
      - name: Build
        working-directory: desktop/ModLaunch
        run: dotnet build -c Release -r linux-x64 -nologo -v q
      # Меньше тысячи игр или сбой сети — код 1, файл не тронут: в ветку не попадёт обрезанный список.
      - name: Generate the game directory
        working-directory: desktop/ModLaunch
        env:
          MODLAUNCH_DATA: ${{ runner.temp }}/modlaunch-data
        run: ./bin/Release/net8.0/linux-x64/ModLaunch --gen-directory Assets/gamedir.config.json
      # Долго (поиск магазина по 100 игр за запрос), поэтому по расписанию — только в первый понедельник месяца.
      # Секрет STEAM_API_KEY (необязательный) даёт официальный список магазина — быстрее и точнее.
      # Сбой здесь не мешает обновить справочник: файл просто не меняется.
      - name: Generate the Steam games list
        continue-on-error: true
        working-directory: desktop/ModLaunch
        env:
          MODLAUNCH_DATA: ${{ runner.temp }}/modlaunch-data
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
        run: |
          if [ "${{ github.event_name }}" = schedule ] && [ "$(date -u +%-d)" -gt 7 ]; then echo "monthly: skipped"; exit 0; fi
          ./bin/Release/net8.0/linux-x64/ModLaunch --gen-steam Assets/steamgames.tsv.gz
      - name: Commit
        run: |
          git config user.name "$(git log -1 --format=%an)"
          git config user.email "$(git log -1 --format=%ae)"
          git add desktop/ModLaunch/Assets/gamedir.config.json
          [ -f desktop/ModLaunch/Assets/steamgames.tsv.gz ] && git add desktop/ModLaunch/Assets/steamgames.tsv.gz
          git diff --cached --quiet && exit 0
          git commit -m "Game directory: refresh snapshots (Nexus, Thunderstore, Steam)"
          # Пока шла сборка, в ветку могли запушить — догоняем и пушим ещё раз.
          git push || (git pull --rebase -q && git push)
