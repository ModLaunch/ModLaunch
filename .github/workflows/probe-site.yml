# Временная проверка: скачивается ли установщик с modlaunchapp.com целиком (скорость, обрывы).
name: probe-site
on:
  push:
    paths: ['.github/workflows/probe-site.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download twice
        run: |
          for i in 1 2; do
            r=$(curl -s -o setup.exe -w "%{http_code} %{size_download} %{speed_download} %{time_total}" --max-time 400 https://modlaunchapp.com/download/ModLaunch-Setup-9.5.0.exe || true)
            sha=$(sha256sum setup.exe | cut -c1-16)
            echo "::notice title=site download $i::code size speedB/s time = $r sha=$sha"
          done
          r=$(curl -s -o gh.exe -L -w "%{http_code} %{size_download} %{speed_download} %{time_total}" --max-time 400 https://raw.githubusercontent.com/ModLaunch/ModLaunch/design-build/ModLaunch-Setup-9.5.0.exe || true)
          echo "::notice title=github download::$r"
