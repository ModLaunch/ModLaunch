# Проверка на живых сайтах: каталоги, разделы, «Нужные моды», установка.
# И друзья — на настоящих правилах базы в эмуляторе Firebase (2.1).
name: check
on:
  workflow_dispatch:
  push:
    branches: ['**']
    paths: ['src/**', 'tools/**', 'firebase/**', '.github/workflows/check.yml']
jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --omit=dev --ignore-scripts
      - run: node tools/probe.js

  friends:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci --omit=dev --ignore-scripts
      - run: npm install --global firebase-tools@14
      - run: node tools/friends-check.js
