# Снимки дизайна: выпускная сборка (один exe), быстрые проверки без сети и снимки экранов.
# При пуше в claude/design-* — все снимки; вручную — можно только снимки функций по фильтру.
# Снимки, вывод программы и журнал ошибок — в ветку design-screens, готовый exe — в design-build.
name: design
on:
  workflow_dispatch:
    inputs:
      filter:
        description: 'Только снимки функций с [DemoShots], чьё имя содержит это (пусто — все снимки)'
        required: false
        default: ''
  push:
    branches: ['claude/design-**']
    paths: ['desktop/**', '.github/workflows/design.yml']
permissions:
  contents: write
jobs:
  shots:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish (Release, one exe)
        working-directory: desktop/ModLaunch
        run: dotnet publish -c Release -r win-x64 -o ../../out
      - name: Self-tests (offline)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath out/ModLaunch.exe -ArgumentList '--selftest' -PassThru -Wait -NoNewWindow -RedirectStandardOutput selftest.txt
          Get-Content selftest.txt
          Get-Content selftest.txt | Where-Object { $_ -match '^\s*(FAIL|ERROR)' } | ForEach-Object { Write-Output "::error title=selftest::$_" }
          if ($p.ExitCode -ne 0) { throw "selftest failed" }
      - name: Shots
        if: success() || failure()
        timeout-minutes: 15
        shell: pwsh
        env:
          MODLAUNCH_SHOTS: ${{ github.event.inputs.filter }}
        run: |
          New-Item -ItemType Directory -Force shots | Out-Null
          $only = if ($env:MODLAUNCH_SHOTS) { @('--only') } else { @() }
          $p = Start-Process -FilePath out/ModLaunch.exe -ArgumentList (@('--screenshot', 'shots') + $only) -PassThru -Wait -NoNewWindow -RedirectStandardOutput shots-out.txt -RedirectStandardError shots-err.txt
          "exit $($p.ExitCode)" | Out-File shots-exit.txt
          Copy-Item shots-out.txt, shots-err.txt, shots-exit.txt shots/ -ErrorAction SilentlyContinue
          Get-ChildItem $env:TEMP -Recurse -Filter errors.log -ErrorAction SilentlyContinue | Select-Object -First 3 | ForEach-Object { Copy-Item $_.FullName "shots/errors-$($_.Directory.Parent.Name).log" }
          Get-Content shots-out.txt | Select-Object -Last 40
          Get-Content shots-err.txt
          if ($p.ExitCode -ne 0) { throw "exit $($p.ExitCode)" }
      # Готовая программа — в ветку design-build, чтобы её можно было забрать git'ом.
      - name: Exe to branch design-build
        if: success() || failure()
        shell: bash
        run: |
          [ -f out/ModLaunch.exe ] || exit 0
          v=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' desktop/ModLaunch/ModLaunch.csproj | head -1)
          mkdir -p pack
          cp out/ModLaunch.exe "pack/ModLaunch-Setup-$v.exe"
          pwsh -NoProfile -Command "Compress-Archive -Path 'pack/ModLaunch-Setup-$v.exe' -DestinationPath 'pack/ModLaunch-Setup-$v.zip' -Force"
          cd pack
          git init -q -b design-build
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "ModLaunch $v (${GITHUB_SHA::7})"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" design-build
      - name: Shots to branch design-screens
        if: success() || failure()
        shell: bash
        run: |
          [ -d shots ] || exit 0
          cd shots
          git init -q -b design-screens
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Снимки дизайна ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" design-screens
