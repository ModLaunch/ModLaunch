name: desktop

# ModLaunch 4 на Avalonia: сборка одним exe под Windows и снимки экранов.
permissions:
  contents: write
on:
  push:
    paths:
      - 'desktop/**'
      - 'firebase/firestore.rules'
      - '.github/workflows/desktop.yml'
      - '!desktop/**/*.md'
  workflow_dispatch:

env:
  DOTNET_NOLOGO: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
# Новый пуш в ту же ветку отменяет старый прогон — очередь не копится.
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # 9.8: быстрее на Windows — без проверки Defender на каждом файле сборки и с кешем NuGet.
      - name: Speed up Windows runner
        shell: pwsh
        run: Set-MpPreference -DisableRealtimeMonitoring $true -ErrorAction SilentlyContinue

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('desktop/**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Publish
        working-directory: desktop/ModLaunch
        run: dotnet publish -c Release -r win-x64 -o ../../out

      - name: Size
        shell: pwsh
        run: Get-ChildItem out | Format-Table Name, @{n='MB';e={[math]::Round($_.Length/1MB,1)}}

      - name: Self-check (live catalogs, install into a test folder)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath out/ModLaunch.exe -ArgumentList '--selfcheck' -PassThru -Wait -NoNewWindow -RedirectStandardOutput selfcheck.txt
          Get-Content selfcheck.txt
          # Упавшие проверки — отдельными пометками: их видно в сводке запуска без скачивания логов.
          Get-Content selfcheck.txt | Where-Object { $_ -match '^\s*(FAIL|ERROR)' } | ForEach-Object { Write-Output "::error title=self-check::$_" }
          if ($p.ExitCode -ne 0) { throw "self-check failed" }

      # 9.8: готовый установщик — та же программа с «Setup» в имени (открывает окно установки).
      # Выкладывается сразу после самопроверки, не дожидаясь снимков экрана.
      - name: Installer
        id: setup
        shell: pwsh
        run: |
          $v = ([xml](Get-Content desktop/ModLaunch/ModLaunch.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          # 2.0: в имени файла — номер с экрана (21.0.0 → 2.0).
          $p = $v.Split('.')
          if ([int]$p[0] -ge 21) { $v = "$([int]$p[0] - 19).$($p[1])" + $(if ([int]$p[2] -gt 0) { ".$($p[2])" } else { "" }) }
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item out/ModLaunch.exe "dist/ModLaunch-Setup-$v.exe"
          "name=ModLaunch-Setup-$v" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.setup.outputs.name }}
          path: dist/${{ steps.setup.outputs.name }}.exe
          compression-level: 0

      - name: Catalog report (counts and top mods per game)
        continue-on-error: true
        shell: pwsh
        run: |
          $p = Start-Process -FilePath out/ModLaunch.exe -ArgumentList '--catalog-report' -PassThru -Wait -NoNewWindow -RedirectStandardOutput report.txt
          Get-Content report.txt

      - name: Screenshots
        if: success() || failure()
        timeout-minutes: 15
        shell: pwsh
        run: |
          $p = Start-Process -FilePath out/ModLaunch.exe -ArgumentList '--screenshot', 'shots' -PassThru -Wait -NoNewWindow
          if ($p.ExitCode -ne 0) { throw "exit $($p.ExitCode)" }
          Get-ChildItem shots

      - uses: actions/upload-artifact@v4
        if: success() || failure()
        with:
          name: screenshots
          path: shots/

      # Снимки — ещё и в ветку desktop-screens: их можно посмотреть прямо в репозитории.
      - name: Screenshots to branch desktop-screens
        if: success() || failure()
        shell: bash
        run: |
          [ -d shots ] || exit 0
          cd shots
          git init -q -b desktop-screens
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Снимки ModLaunch ${GITHUB_SHA::7} (${GITHUB_REF_NAME})"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" desktop-screens
