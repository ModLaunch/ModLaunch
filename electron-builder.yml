# Сборка ModLaunch (3.0).
#
# ModLaunch-Setup-<версия>.exe — свой установщик: одна программа в обёртке
# portable. Обёртка распаковывает ModLaunch во временную папку (пока идёт
# распаковка, видна заставка build/splash.bmp) и запускает его; по имени
# файла с «Setup» программа открывает своё окно установки (src/setup),
# а с флагом --update — сразу обновляет уже установленную копию.
#
# ModLaunch-<версия>-win-x64.zip — та же программа одной папкой, без установки.
#
# Собирается командой `npm run dist`: build/build.js сначала готовит копию
# программы с обфусцированным кодом в .build/app, а electron-builder
# упаковывает уже её.
appId: ModHub.Launcher
productName: ModLaunch
copyright: ModLaunch
directories:
  output: dist
  buildResources: build
  app: .build/app
files:
  - package.json
  - src/**/*
  - node_modules/**/*
extraResources:
  - from: src/assets/icon.ico
    to: modhub.ico
afterPack: build/after-pack.js
win:
  target:
    - target: portable
      arch: [x64]
    - target: zip
      arch: [x64]
  icon: src/assets/icon.ico
  executableName: ModLaunch
  artifactName: ModLaunch-${version}-win-${arch}.${ext}
  signAndEditExecutable: false
portable:
  artifactName: ModLaunch-Setup-${version}.exe
  splashImage: build/splash.bmp
  unpackDirName: ModLaunchSetup
