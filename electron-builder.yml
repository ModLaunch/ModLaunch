# Сборка ModHub-Setup.exe: один exe без распаковщика NSIS.
# Установщик — сама программа (src/main/setup): если имя файла содержит
# «Setup», вместо лаунчера открывается окно установки.
appId: ModHub.Launcher
productName: ModHub
copyright: ModHub
directories:
  output: dist
files:
  - package.json
  - src/**/*
  - "!src/**/*.md"
extraResources:
  - from: src/assets/icon.ico
    to: modhub.ico
win:
  target:
    - target: portable
      arch: [x64]
  icon: src/assets/icon.ico
  executableName: ModHub
  signAndEditExecutable: false
portable:
  artifactName: ModHub-Setup-${version}.exe
  unicode: true
afterPack: build/after-pack.js
