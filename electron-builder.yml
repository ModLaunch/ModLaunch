# Сборка установщика ModLaunch-Setup-<версия>.exe (2.0).
#
# Полноценный мастер установки NSIS: язык (русский/английский), условия
# использования, выбор папки, ярлыки на рабочем столе и в «Пуске», запуск
# после установки, удаление через «Приложения» Windows.
#
# Собирается командой `npm run dist`: build/build.js сначала готовит копию
# программы с обфусцированным кодом в .build/app, а electron-builder
# упаковывает уже её.
appId: ModHub.Launcher
productName: ModLaunch
copyright: ModLaunch
directories:
  output: dist
  buildResources: build
  app: .build/app
files:
  - package.json
  - src/**/*
  - node_modules/**/*
extraResources:
  - from: src/assets/icon.ico
    to: modhub.ico
afterPack: build/after-pack.js
win:
  target:
    - target: nsis
      arch: [x64]
    # Портативная версия: одна папка в zip, распаковал — запустил ModLaunch.exe.
    - target: zip
      arch: [x64]
  icon: src/assets/icon.ico
  executableName: ModLaunch
  # Имя для zip; у установщика своё — в разделе nsis.
  artifactName: ModLaunch-${version}-win-${arch}.${ext}
  signAndEditExecutable: false
nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: ModLaunch
  runAfterFinish: true
  license: build/license.txt
  installerIcon: src/assets/icon.ico
  uninstallerIcon: src/assets/icon.ico
  installerHeaderIcon: src/assets/icon.ico
  multiLanguageInstaller: true
  installerLanguages: [ru_RU, en_US]
  language: '1049'
  displayLanguageSelector: false
  unicode: true
  deleteAppDataOnUninstall: false
  uninstallDisplayName: ModLaunch
  include: build/installer.nsh
  artifactName: ModLaunch-Setup-${version}.exe
